<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section data-screen-label="Closing CTA" style="position:relative;overflow:hidden;background:#173A66;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;">
  <img src="{{ img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ pos }};opacity:0.22;">
  <div style="position:relative;max-width:1320px;margin:0 auto;padding:clamp(80px,10vw,140px) clamp(16px,3vw,32px);text-align:center;">
    <h2 style="margin:0 auto;max-width:13em;font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(38px,5.6vw,76px);line-height:1;letter-spacing:-0.04em;text-wrap:balance;">{{ title }}</h2>
    <sc-if value="{{ hasBody }}" hint-placeholder-val="{{ false }}">
      <p style="margin:20px auto 0;max-width:32em;font-size:18px;line-height:1.5;color:#D6E3F3;text-wrap:pretty;">{{ body }}</p>
    </sc-if>
    <a href="{{ href }}" style="display:inline-flex;margin-top:32px;padding:17px 30px;border-radius:999px;background:#fff;color:#173A66;font-weight:600;font-size:17px;transition:transform 100ms ease-out;" style-active="transform:scale(0.97);">{{ label }}</a>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:460},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Come see what makes Saint Martin's home.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Schedule a visit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Request a Tour.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/cd/07235.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pos&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;center 30%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { img: p.img ?? 'assets/cd/07235.jpg', pos: p.pos ?? 'center 30%', href: p.href ?? 'Request a Tour.dc.html', label: p.label ?? 'Schedule a visit', hasBody: !!p.body };
  }
}
</script>
</body>
</html>
